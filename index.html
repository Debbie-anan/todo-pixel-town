</style><link rel="stylesheet" href="game.css?v=7"></head><body data-screen="today"><header><div class="brand"><div class="logo">⌂</div><div><b>待办小镇</b><small>LITTLE STEPS, LOVELY LIFE</small></div></div><nav aria-label="主导航"><button class="active" data-view="today">每日待办</button><button data-view="room">我的小屋</button><button data-view="bag">家具图鉴</button></nav><div class="user"><span class="coin">✦ <b id="coins">0</b></span><div class="avatar">🌱</div></div></header><main><div class="welcome"><div><div class="eyebrow">A LITTLE BETTER, EVERY DAY</div><h1>慢慢来，小屋也会慢慢长大。<span style="font-size:23px">🌿</span></h1><p>完成一件小事，收获一份属于你的美好。</p></div><span class="pill">✧ 今天也是充满可能的一天</span></div><div class="layout"><section class="panel tasks"><div class="sectionhead"><h2 id="dateTitle"></h2><span id="month"></span></div><div id="week" class="week"></div><div class="progresslabel"><span id="progressText"></span><span id="progressPercent"></span></div><div class="progress"><i id="progressBar"></i></div><div id="taskList"></div><button class="add" id="add">＋ 添加一个小目标</button><div class="tip"><span>🎁</span><span>每完成一个待办，就能收到一件随机收藏。<br>让努力变成看得见的小幸福。</span></div></section><section class="panel"><div class="roomheader"><div><h2>我的森系小屋 <span style="font-size:11px;color:#a3ad83">Lv. <span id="level">1</span></span></h2><p id="roomSubtitle">把每一次努力，都安放在这里</p></div><button class="outline" id="editRoom">▧ 布置小屋</button></div><div id="moveControls" class="move-controls" hidden><span id="selectionName"></span><button class="outline" id="cancelMove">取消选择</button><button class="outline" id="returnItem">收回背包</button></div><div class="scene"><canvas id="room" aria-label="可布置的像素小屋"></canvas><span class="scene-label">☀ 午后 · 森林小镇</span><span class="scene-bottom" id="roomHint">今日份的努力，正在发芽</span></div><div class="inventory"><div class="inventoryhead"><b id="bagTitle">我的背包</b><span id="bagCount"></span></div><div class="collection-filters" id="collectionFilters"><label for="collectionFilter">筛选收藏</label><sel const key='little-town-v1',today=new Date(),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,todayKey=dateKey(today);let selectedDate=todayKey,edit=false,selectedItem=0,view='today';const furniture=['薄荷小沙发','橡木小书桌','绿植盆栽','暖光落地灯','草莓小地毯','复古小书架','午后小茶桌','猫咪抱枕'];let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!state.tasks)state={tasks:[{id:crypto.randomUUID(),date:todayKey,title:'喝一杯水，给自己充充电',category:'生活',done:false},{id:crypto.randomUUID(),date:todayKey,title:'读 20 分钟喜欢的书',category:'成长',done:false},{id:crypto.randomUUID(),date:todayKey,title:'完成今天最重要的一件事',category:'工作',done:false}],coins:0,bag:[1,1,2,1,1,0,0,0],placed:[{type:0,x:220,y:188},{type:1,x:145,y:149},{type:2,x:280,y:143},{type:3,x:260,y:182},{type:4,x:202,y:223}],completed:0};const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(state))}function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}function modal(html){$('#modalRoot').innerHTML='<div class="modalback"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';$('#modalRoot input, #modalRoot button')?.focus();$('.modalback').onclick=e=>{if(e.target===e.currentTarget)close()}}function close(){$('#modalRoot').innerHTML=''}

function drawRoom(){const c=$('#room');c.width=400;c.height=280;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const r=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};r(0,0,400,280,'#dae7cb');for(let i=0;i<100;i++){let x=(i*73)%400,y=(i*47)%280;r(x,y,2,2,i%2?'#c6d8b2':'#e5eed6')}r(65,249,285,5,'#bccda7');g.fillStyle='#ecdfbd';g.beginPath();g.moveTo(65,107);g.lineTo(276,73);g.lineTo(350,151);g.lineTo(140,211);g.closePath();g.fill();r(65,107,4,113,'#9f9b75');g.fillStyle='#f7edce';g.beginPath();g.moveTo(65,42);g.lineTo(276,42);g.lineTo(276,145);g.lineTo(65,180);g.closePath();g.fill();g.fillStyle='#ddd8b1';g.beginPath();g.moveTo(276,42);g.lineTo(349,107);g.lineTo(349,215);g.lineTo(276,145);g.closePath();g.fill();g.fillStyle='#d4b484';g.beginPath();g.moveTo(65,180);g.lineTo(276,145);g.lineTo(349,215);g.lineTo(141,255);g.closePath();g.fill();g.strokeStyle='#be9b70';g.lineWidth=1;for(let i=0;i<9;i++){g.beginPath();g.moveTo(65+i*24,180-i*4);g.lineTo(141+i*24,255-i*4);g.stroke()}for(let i=1;i<6;i++){g.beginPath();g.moveTo(65+i*15,180+i*15);g.lineTo(276+i*15,145+i*14);g.stroke()}r(65,41,212,4,'#b4a27b');r(65,176,5,5,'#987b58');r(115,67,57,62,'#957b51');r(119,71,49,53,'#b9d7d0');r(124,76,39,43,'#d9eee0');r(140,71,4,53,'#957b51');r(119,97,49,4,'#957b51');r(111,125,65,5,'#b9966c');r(108,63,9,61,'#a4b183');r(170,63,9,61,'#a4b183');r(105,60,77,5,'#7b7150');r(207,69,26,25,'#8a7657');r(210,72,20,19,'#e5dba9');r(217,75,6,9,'#91a273');r(214,85,12,3,'#91a273');state.placed.slice().sort((a,b)=>a.y-b.y).forEach(p=>sprite(g,p.type,p.x,p.y));sprite(g,2,46,210,1.2);sprite(g,2,367,241,1.3);r(181,199,17,20,'#dca575');r(184,195,13,8,'#67503b');r(181,214,19,18,'#8ea174');r(184,231,5,9,'#6a5c44');r(193,231,5,9,'#6a5c44');r(190,207,2,2,'#554c3a');r(178,215,4,11,'#dca575');r(200,215,4,11,'#dca575');if(edit){g.strokeStyle='#ffffffaa';g.setLineDash([3,3]);g.strokeRect(85,157,240,85)}}
function render(){const d=new Date(selectedDate+'T12:00:00'),tasks=state.tasks.filter(t=>t.date===selectedDate),done=tasks.filter(t=>t.done).length;$('#dateTitle').textContent=selectedDate===todayKey?'今天的小目标':`${d.getMonth()+1}月${d.getDate()}日的小目标`;$('#month').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;$('#week').innerHTML='';const start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));for(let i=0;i<7;i++){const day=new Date(start);day.setDate(start.getDate()+i);const k=dateKey(day),b=document.createElement('button');b.className='day'+(k===selectedDate?' selected':'');b.innerHTML=`<span>${['一','二','三','四','五','六','日'][i]}</span><b>${day.getDate()}</b>`;b.onclick=()=>{selectedDate=k;render()};$('#week').append(b)}$('#progressText').textContent=`已完成 ${done} / ${tasks.length} 个小目标`;const pct=tasks.length?Math.round(done/tasks.length*100):0;$('#progressPercent').textContent=pct+'%';$('#progressBar').style.width=pct+'%';$('#taskList').innerHTML='';if(!tasks.length)$('#taskList').innerHTML='<div class="empty">这一天还是一张白纸。<br>写下一个想完成的小目标吧 ✧</div>';tasks.forEach(t=>{let e=document.createElement('div');e.className='task'+(t.done?' done':'');const b=document.createElement('button');b.className='check';b.textContent=t.done?'✓':'';b.setAttribute('aria-label',t.done?'已完成':'完成 '+t.title);b.disabled=t.done;b.onclick=()=>complete(t);let content=document.createElement('div'),strong=document.createElement('strong');strong.textContent=t.title;content.append(strong);let small=document.createElement('small');small.textContent=t.done?'✓ 已收获一份小美好':`${t.category} · ✦ 10 小镇币 + 随机收藏`;content.append(small);let remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','删除 '+t.title);remove.onclick=()=>{if(confirm('删除这个待办？已领取的奖励会保留。')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}};e.append(b,content,remove);$('#taskList').append(e)});$('#coins').textContent=state.coins;$('#level').textContent=1+Math.floor(state.completed/5);$('#bagTitle').textContent=view==='bag'?'家具图鉴':'我的背包';$('#bagCount').textContent=`${state.bag.reduce((a,b)=>a+b,0)} 件家具 · ${state.placed.length} 件已摆放`;$('#catalogNote').hidden=view!=='bag';$('#items').innerHTML='';furniture.forEach((name,i)=>{if(view!=='bag'&&!state.bag[i])return;let e=document.createElement('button');e.className='item'+(selectedItem===i&&edit?' selected':'');e.innerHTML='<canvas width="64" height="64"></canvas><small></small><em></em>';e.querySelector('small').textContent=name;e.querySelector('em').textContent='×'+state.bag[i];sprite(e.querySelector('canvas').getContext('2d'),i,32,36);e.onclick=()=>{if(!state.bag[i]){toast('完成待办，解锁这件家具吧！');return}selectedItem=i;edit=true;render();toast('已选中'+name+'，点击小屋地板摆放')};$('#items').append(e)});$('#editRoom').textContent=edit?'✓ 完成布置':'▧ 布置小屋';$('#roomHint').textContent=edit?'点击地板摆放 · 点击家具收回':'今日份的努力，正在发芽';drawRoom()}
function complete(t){if(t.done)return;t.done=true;state.completed++;state.coins+=10;const reward=Math.floor(Math.random()*furniture.length);state.bag[reward]++;save();render();modal(`<div class="eyebrow">A LITTLE GIFT FOR YOU</div><h2>小目标完成，奖励送达！</h2><canvas id="reward" width="64" height="64"></canvas><h3>${furniture[reward]}</h3><p>今天又向前走了一小步。<br>奖励已放入背包，另外获得 ✦ 10 小镇币。</p><button class="primary" id="claim">收下这份小美好</button>`);sprite($('#reward').getContext('2d'),reward,32,36);$('#claim').onclick=close}
$('#add').onclick=()=>{modal('<h2>写下一个小目标</h2><p>一点点行动，就能让生活变得更好。</p><form id="newTask"><input name="title" aria-label="待办内容" placeholder="比如：出门散步 15 分钟" maxlength="80" required><input name="date" aria-label="待办日期" type="date" required><select name="category" aria-label="分类"><option>生活</option><option>成长</option><option>工作</option><option>学习</option></select><button class="primary" type="submit">加入我的待办</button> <button type="button" class="outline" id="cancel">取消</button></form>');$('#newTask [name=date]').value=selectedDate;$('#cancel').onclick=close;$('#newTask').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title)return;selectedDate=f.get('date');state.tasks.push({id:crypto.randomUUID(),title,date:selectedDate,category:f.get('category'),done:false});save();close();render()}};$('#editRoom').onclick=()=>{edit=!edit;render()};$('#room').onclick=e=>{if(!edit){toast('点击「布置小屋」开始装饰');return}const bounds=e.target.getBoundingClientRect(),x=(e.clientX-bounds.left)/bounds.width*400,y=(e.clientY-bounds.top)/bounds.height*280;const hit=state.placed.findLastIndex(p=>Math.abs(p.x-x)<22&&y>p.y-35&&y<p.y+22);if(hit>=0){const [p]=state.placed.splice(hit,1);state.bag[p.type]++;save();render();return}if(y<155||y>245||x<85||x>325){toast('请放在小屋地板上');return}if(!state.bag[selectedItem]){toast('这件家具都摆好了，选一件其他家具吧');return}state.bag[selectedItem]--;state.placed.push({type:selectedItem,x:Math.round(x/4)*4,y:Math.round(y/4)*4});save();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));edit=view==='room';render();if(view!=='today')$('.roomheader').scrollIntoView({behavior:'smooth',block:'nearest'})});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});save();render();
</script><script src="public-items.js?v=7"></script><script src="room.js?v=7"></script><script src="install.js"></script></body></html>
